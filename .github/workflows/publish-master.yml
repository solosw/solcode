name: Publish master

# Rolling binary channel: every push to master/main rebuilds and updates
# GitHub Release tag "master". Install scripts download from that tag.
# There is no "latest" release channel.
#
# Only the computer-use flavor is published:
#   solcode_<ver>_<os>_<arch>_computeruse.<pack>  embedded open-computer-use native runtime

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-computeruse:
    # Host builds are pure Go. Retain the existing platform matrix and asset
    # names while embedding pinned native runtimes (CodeGraph is built from patched source).
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            codegraph_target: x86_64-unknown-linux-musl
            pack: tar.gz
          - runner: windows-latest
            goos: windows
            goarch: amd64
            codegraph_target: x86_64-pc-windows-msvc
            pack: zip
          - runner: macos-14
            goos: darwin
            goarch: arm64
            codegraph_target: aarch64-apple-darwin
            pack: tar.gz
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            codegraph_target: aarch64-unknown-linux-musl
            pack: tar.gz
            experimental: true
          - runner: windows-11-arm
            goos: windows
            goarch: arm64
            codegraph_target: aarch64-pc-windows-msvc
            pack: zip
            experimental: true
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            codegraph_target: x86_64-apple-darwin
            pack: tar.gz
            experimental: true
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental || false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Resolve version label
        shell: bash
        run: echo "LDFLAGS_VERSION=master+$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_ENV"

      - name: Setup Rust for patched CodeGraph
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.codegraph_target }}

      - name: Install Linux native build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools build-essential

      - name: Cache CodeGraph build dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/solcode-codegraph-build
          key: codegraph-${{ runner.os }}-${{ matrix.goarch }}-1.98.0-${{ hashFiles('internal/codegraphruntime/bundle/release.json', 'scripts/codegraph/external-index.patch') }}

      - name: Verify patched CodeGraph runtime
        shell: bash
        env:
          CGO_ENABLED: '0'
          SOLCODE_CODEGRAPH_SMOKE: '1'
        run: |
          python -m unittest discover -s scripts -p test_prepare_codegraph.py -v
          python scripts/prepare-codegraph.py --os "${{ matrix.goos }}" --arch "${{ matrix.goarch }}"
          go test ./internal/codegraphruntime/... ./internal/mcp -run 'TestCodeGraph.*Smoke$|TestPatchedPayload|TestPreparedPayload' -v -count=1

      - name: Build computer-use asset
        shell: bash
        run: |
          chmod +x scripts/build-computeruse.sh
          ./scripts/build-computeruse.sh master "${{ matrix.goos }}" "${{ matrix.goarch }}" "${{ matrix.pack }}"

      - name: Upload computer-use asset
        uses: actions/upload-artifact@v4
        with:
          name: dist-computeruse-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*_computeruse.*
          if-no-files-found: error

  publish:
    needs: [build-computeruse]
    # Required matrix legs (non-experimental) must succeed. Experimental legs
    # use continue-on-error and do not fail the job.
    if: needs.build-computeruse.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download all assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Regenerate checksums
        run: |
          cd dist
          rm -f checksums.txt
          # Require at least one computer-use archive before publishing.
          shopt -s nullglob
          assets=(solcode_*_computeruse.*)
          if ((${#assets[@]} == 0)); then
            echo "no computer-use assets downloaded; refusing to publish" >&2
            ls -la
            exit 1
          fi
          sha256sum solcode_* > checksums.txt
          ls -la

      - name: Publish rolling master release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: master
          name: master (rolling)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: |
            Rolling build from branch `${{ github.ref_name }}`.

            - Commit: `${{ github.sha }}`
            - Install (Linux/macOS): `curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/master/scripts/install.sh | bash`
            - Install (Windows): `irm https://raw.githubusercontent.com/${{ github.repository }}/master/scripts/install.ps1 | iex`

            Published assets use a pure-Go host with embedded native ComputerUse and
            patched CodeGraph runtimes. The historical `*_computeruse` suffix is
            retained for installer compatibility; no system Node/Python is needed.

            Assets are overwritten on each push to master/main.
          files: |
            dist/solcode_*
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}