name: Publish master

# Rolling binary channel: every push to master/main rebuilds and updates
# GitHub Release tag "master". Install scripts download from that tag.
# There is no "latest" release channel.
#
# Two build flavors ship side by side:
#   solcode_<ver>_<os>_<arch>.<pack>              default (CGO disabled, stub driver)
#   solcode_<ver>_<os>_<arch>_computeruse.<pack>  CGO + robotgo desktop automation

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-default:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build release assets
        env:
          # Asset names stay solcode_master_* so install URLs stay stable.
          # Binary -version embeds master+shortsha.
          VERSION_LABEL: master
        run: |
          chmod +x scripts/build-release.sh
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          # build-release uses first arg for asset version AND ldflags by default;
          # inject a more informative binary version via VERSION_LDFLAGS override if present.
          # We pass "master" as asset version, and set ldflags version separately.
          export LDFLAGS_VERSION="master+${SHORT_SHA}"
          ./scripts/build-release.sh master

      - name: Upload default assets
        uses: actions/upload-artifact@v4
        with:
          name: dist-default
          path: dist/*
          if-no-files-found: error

  build-computeruse:
    # robotgo needs CGO and a *native* toolchain for each target, so these legs
    # run on matching runners instead of cross-compiling. ARM runners are newer
    # and marked experimental: if one is unavailable or lacks a toolchain, the
    # release still publishes the other computer-use assets.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            pack: tar.gz
          - runner: windows-latest
            goos: windows
            goarch: amd64
            pack: zip
          - runner: macos-14
            goos: darwin
            goarch: arm64
            pack: tar.gz
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            pack: tar.gz
            experimental: true
          - runner: windows-11-arm
            goos: windows
            goarch: arm64
            pack: zip
            experimental: true
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            pack: tar.gz
            experimental: true
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental || false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc libc6-dev pkg-config zip \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxtst-dev libxinerama-dev libxrandr-dev libxcursor-dev \
            libpng-dev

      # windows-11-arm ships an emulated x86_64 MinGW gcc that cannot assemble
      # runtime/cgo/gcc_arm64.S. Install a native aarch64 llvm-mingw instead.
      - name: Install Windows ARM64 CGO toolchain
        if: runner.os == 'Windows' && matrix.goarch == 'arm64'
        shell: pwsh
        run: ./scripts/setup-windows-arm64-cgo.ps1

      - name: Verify C toolchain
        shell: bash
        run: |
          # macOS exposes clang as cc/gcc via the Xcode shim; Linux/Windows use gcc.
          if [[ -n "${CC:-}" ]] && command -v "$CC" >/dev/null 2>&1; then
            cc_bin="$CC"
          elif command -v cc >/dev/null 2>&1; then
            cc_bin=cc
          elif command -v gcc >/dev/null 2>&1; then
            cc_bin=gcc
          else
            echo "no C compiler found (cc/gcc)" >&2
            exit 1
          fi
          echo "C compiler: $cc_bin"
          "$cc_bin" --version
          machine="$("$cc_bin" -dumpmachine 2>/dev/null || true)"
          echo "dumpmachine: ${machine:-unknown}"
          if [[ "${{ matrix.goos }}" == "windows" && "${{ matrix.goarch }}" == "arm64" ]]; then
            if [[ "$machine" != *aarch64* && "$machine" != *arm64* ]]; then
              echo "windows/arm64 CGO needs an aarch64 MinGW toolchain (got '${machine:-none}')" >&2
              exit 1
            fi
          fi

      - name: Resolve version label
        shell: bash
        run: echo "LDFLAGS_VERSION=master+$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_ENV"

      - name: Build computer-use asset
        shell: bash
        run: |
          chmod +x scripts/build-computeruse.sh
          ./scripts/build-computeruse.sh master "${{ matrix.goos }}" "${{ matrix.goarch }}" "${{ matrix.pack }}"

      - name: Upload computer-use asset
        uses: actions/upload-artifact@v4
        with:
          name: dist-computeruse-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*_computeruse.*
          if-no-files-found: error

  publish:
    needs: [build-default, build-computeruse]
    if: needs.build-default.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download all assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Regenerate checksums
        run: |
          cd dist
          rm -f checksums.txt
          sha256sum solcode_* > checksums.txt
          ls -la

      - name: Publish rolling master release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: master
          name: master (rolling)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: |
            Rolling build from branch `${{ github.ref_name }}`.

            - Commit: `${{ github.sha }}`
            - Install (Linux/macOS): `curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/master/scripts/install.sh | bash`
            - Install (Windows): `irm https://raw.githubusercontent.com/${{ github.repository }}/master/scripts/install.ps1 | iex`

            Assets ending in `_computeruse` are built with CGO and `-tags computeruse`
            (robotgo desktop automation). The default assets stay CGO-free.

            Assets are overwritten on each push to master/main.
          files: |
            dist/solcode_*
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}